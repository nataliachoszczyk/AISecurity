# unet-v6 with width 64, 100 epochs, fp16, EMA weights and a checkpoint after each 5 epochs. The checkpoint with the most tune points wins.
seed: 0
tune_fraction: 0.1
width: 64
use_ig: true
ig_steps: 8
epochs: 100
batch: 64
lr: 0.002
weight_decay: 0.0001
mask_threshold: 0.5
min_area: 30
candidates: 6
batch_causal: 250
chunk: 1500
thresholds: [0.0, 3.0, 61]
best_epoch: false
boxes: fit
fit_offset: 0.3
generated: true
amp: true
ema: 0.999
checkpoint_every: 5
