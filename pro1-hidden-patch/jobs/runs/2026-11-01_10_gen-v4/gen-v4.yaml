# Attacked images with the patch at any position. The UNet jobs use its train part and its val part (gen_val).
seed: 0
train_copies: 64
val_copies: 20
batch: 2048
# The train part stops after this time. The limit of a Kaggle session is 12 hours.
hours: 9
# The tune part of the UNet (src/evaluate.py tune_ids): the same values as tune_fraction and seed in the UNet configs.
tune_fraction: 0.1
tune_seed: 0
# JPEG quality range. The test has 80-96 (about 20% of the images below 90). The train images have only 90-96.
jpeg: [80, 95]
