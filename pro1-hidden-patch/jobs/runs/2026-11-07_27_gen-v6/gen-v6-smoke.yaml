# Smoke test of gen-v6 in the same session: the full flow with 4 bases for each part.
seed: 6
train_copies: 4
val_copies: 4
hflip: true
base_aug: true
batch: 64
hours: 0.5
saliency_tie: 0.9
saliency_threshold: 1.85
tune_fraction: 0.1
tune_seed: 0
jpeg: [80, 95]
max_bases: 4
# Few images give a noisy strength distribution, so the check of the strength gap is off.
max_strength_gap: 100.0
