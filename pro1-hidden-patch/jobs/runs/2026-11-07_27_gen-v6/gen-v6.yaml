# gen-v5 with seed 6 on the account nataliachoszczyk.
# The val part is small, because the UNet jobs use the val part of gen-v4. 8 val copies give enough C&W images for the strength check.
seed: 6
train_copies: 64
val_copies: 8
base_aug: true
batch: 2048
# The train part stops after this time. The limit of a Kaggle session is 12 hours.
hours: 9.5
# The tune part of the UNet (src/evaluate.py tune_ids): the same values as tune_fraction and seed in the UNet configs.
tune_fraction: 0.1
tune_seed: 0
jpeg: [80, 95]
