# unet-v11 with 2 transformer layers at the 8x8 level (attn) and train_seed 2, also a second model for an ensemble.
seed: 0
tune_fraction: 0.1
width: 64
use_ig: true
ig_steps: 8
epochs: 120
batch: 64
lr: 0.05
weight_decay: 0.0005
mask_threshold: 0.5
min_area: 30
candidates: 6
batch_causal: 250
chunk: 1500
thresholds: [0.0, 3.0, 61]
best_epoch: false
boxes: fit
fit_offset: 0.3
generated: true
amp: true
ema: 0.999
checkpoint_every: 5
optimizer: sgd
train_seed: 2
generated_sets: [gen-v4, gen-v5, gen-v6]
attn: 2
