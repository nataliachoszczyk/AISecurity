# Diagnostics (A) and post-processing (B) on the masks of unet-v8a, unet-v8b and their mean. No training.
seed: 0
tune_fraction: 0.1
use_ig: true
ig_steps: 8
boxes: fit
fit_offset: 0.3
candidates: 6
batch_causal: 250
chunk: 1500
thresholds: [0.0, 3.0, 61]
models:
  v8b: [unet-v8b]
  v8a: [unet-v8a]
  ens: [unet-v8a, unet-v8b]
soft_radius: 3
soft_gamma: [0.5, 1.0, 2.0, 4.0]
soft_pad: [4, 8]
causal_shift: 3
causal_ties: [0.7, 0.8, 0.85, 0.9, 0.95, 1.0]
selector_iter: 200
selector_folds: 5
selector_thresholds: [0.0, 0.6, 61]
