# Box refinement on the mean of unet-v8a and unet-v8b: tuned fit offset, soft and the scan statistic. No training.
seed: 0
tune_fraction: 0.1
use_ig: true
ig_steps: 8
boxes: fit
fit_offset: 0.3
fit_offsets: [0.2, 0.25, 0.3, 0.35, 0.4]
candidates: 6
batch_causal: 250
chunk: 1500
thresholds: [0.0, 3.0, 61]
models:
  ens: [unet-v8a, unet-v8b]
soft_radius: 3
soft_gamma: [0.5, 1.0, 2.0, 4.0]
soft_pad: [4, 8]
variants: [scan]
scan_radius: 4
scan_lams: [0.0, 0.1, 0.3, 1.0, 3.0, 10.0]
scan_pads: [4, 8]
