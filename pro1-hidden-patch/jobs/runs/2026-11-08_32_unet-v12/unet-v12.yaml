# unet-v9a (activation maps, val 0.684) on the real images and gen-v4, gen-v5 and gen-v6. 100 epochs fit in the 12-hour limit.
seed: 0
tune_fraction: 0.1
width: 64
use_ig: true
ig_steps: 8
epochs: 100
batch: 64
lr: 0.05
weight_decay: 0.0005
mask_threshold: 0.5
min_area: 30
candidates: 6
batch_causal: 250
chunk: 1500
thresholds: [0.0, 3.0, 61]
best_epoch: false
boxes: fit
fit_offset: 0.3
generated: true
amp: true
ema: 0.999
checkpoint_every: 5
optimizer: sgd
train_seed: 1
generated_sets: [gen-v4, gen-v5, gen-v6]
use_act: true
half_inputs: true
