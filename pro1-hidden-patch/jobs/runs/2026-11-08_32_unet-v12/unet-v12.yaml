# unet-v9a on the real images and gen-v4, gen-v5 and gen-v6. 100 epochs fit in the 12-hour limit.
seed: 0
tune_fraction: 0.1
width: 64
ig_steps: 8
epochs: 100
batch: 64
lr: 0.05
weight_decay: 0.0005
candidates: 6
batch_causal: 250
chunk: 1500
thresholds: [0.0, 3.0, 61]
fit_offset: 0.3
ema: 0.999
checkpoint_every: 5
train_seed: 1
generated_sets: [gen-v4, gen-v5, gen-v6]
half_inputs: true
