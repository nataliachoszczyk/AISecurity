# unet-v3 with 80 epochs and the weights of the epoch with the lowest tune loss.
seed: 0
tune_fraction: 0.1
width: 32
use_ig: true
ig_steps: 8
epochs: 80
batch: 64
lr: 0.002
weight_decay: 0.0001
mask_threshold: 0.5
min_area: 30
candidates: 6
batch_causal: 250
chunk: 1500
thresholds: [0.0, 3.0, 61]
best_epoch: true
