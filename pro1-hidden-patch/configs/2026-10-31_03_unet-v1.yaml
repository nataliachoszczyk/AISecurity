# UNet on the image and its noise residual finds the patch and the decoys, a causal check with ResNet-18 selects the patch.
seed: 0
tune_fraction: 0.1
width: 32
use_ig: false
epochs: 60
batch: 64
lr: 0.002
weight_decay: 0.0001
mask_threshold: 0.5
min_area: 30
candidates: 6
batch_causal: 250
chunk: 1500
thresholds: [0.0, 3.0, 61]
