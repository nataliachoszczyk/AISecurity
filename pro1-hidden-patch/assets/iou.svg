<g font-size="12" fill="#868e96" text-anchor="middle"><text x="60" y="54">0</text><text x="130" y="54">10</text><text x="200" y="54">20</text><text x="270" y="54">30</text><text x="340" y="54">40</text><text x="410" y="54">50</text></g>
<g font-size="12" fill="#868e96" text-anchor="end"><text x="54" y="64">0</text><text x="54" y="134">10</text><text x="54" y="204">20</text><text x="54" y="274">30</text><text x="54" y="344">40</text><text x="54" y="414">50</text></g>
