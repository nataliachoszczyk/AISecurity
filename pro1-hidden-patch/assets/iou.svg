<rect x="394" y="520" width="40" height="80" fill="none" stroke="#1c7ed6" stroke-width="2.5" stroke-dasharray="7 4"/>
<text x="394" y="662" font-size="13" fill="#495057">po&#322;owa &#322;atki</text>
<text x="394" y="682" font-weight="700" font-size="14">IoU = 200/400 &#8776; 0,50</text>
