<rect x="600" y="100" width="60" height="60" fill="#a5d8ff" opacity=".7"/>
<rect x="600" y="100" width="30" height="30" fill="url(#hatch)"/>
<rect x="570" y="70" width="60" height="60" fill="none" stroke="#d9480f" stroke-width="2.5"/>
<rect x="600" y="100" width="60" height="60" fill="none" stroke="#1c7ed6" stroke-width="2.5" stroke-dasharray="7 4"/>
