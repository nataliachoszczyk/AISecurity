<text x="212" y="662" font-size="13" fill="#495057">przesuni&#281;ta o p&#243;&#322;</text>
<text x="212" y="682" font-weight="700" font-size="14">IoU = 200/600 &#8776; 0,33</text>
<rect x="394" y="520" width="80" height="80" fill="#ffd8a8" opacity=".7"/>
<rect x="394" y="520" width="40" height="80" fill="#a5d8ff" opacity=".7"/>
