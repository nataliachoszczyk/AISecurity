<text x="130" y="122" fill="#d9480f" font-weight="700">prawdziwa &#322;atka: 10,10,30,30</text>
<text x="340" y="360" fill="#1c7ed6" font-weight="700" text-anchor="end">odpowied&#378;: 20,20,40,40</text>
<text x="235" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">wsp&#243;lna</text>
<text x="470" y="40" font-weight="700" font-size="16">Wz&#243;r</text>
<text x="470" y="177" font-size="22" font-weight="700">IoU =</text>
