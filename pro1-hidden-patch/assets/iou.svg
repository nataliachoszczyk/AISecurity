<rect x="616" y="560" width="80" height="80" fill="#a5d8ff" opacity=".7"/>
<rect x="616" y="560" width="40" height="40" fill="url(#hatch)"/>
<rect x="576" y="520" width="80" height="80" fill="none" stroke="#d9480f" stroke-width="2.5"/>
<rect x="616" y="560" width="80" height="80" fill="none" stroke="#1c7ed6" stroke-width="2.5" stroke-dasharray="7 4"/>
<text x="576" y="662" font-size="13" fill="#495057">przesuni&#281;ta po skosie</text>
<text x="576" y="682" font-weight="700" font-size="14">IoU = 100/700 &#8776; 0,14</text>
<rect x="758" y="520" width="80" height="80" fill="#ffd8a8" opacity=".7"/>
<rect x="854" y="520" width="80" height="80" fill="#a5d8ff" opacity=".7"/>
<rect x="758" y="520" width="80" height="80" fill="none" stroke="#d9480f" stroke-width="2.5"/>
<rect x="854" y="520" width="80" height="80" fill="none" stroke="#1c7ed6" stroke-width="2.5" stroke-dasharray="7 4"/>
<text x="758" y="662" font-size="13" fill="#495057">obok &#322;atki</text>
<text x="758" y="682" font-weight="700" font-size="14">IoU = 0</text>
