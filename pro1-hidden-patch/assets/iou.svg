<rect x="600" y="212" width="60" height="60" fill="none" stroke="#1c7ed6" stroke-width="2.5" stroke-dasharray="7 4"/>
<text x="690" y="140">pole cz&#281;&#347;ci wsp&#243;lnej</text>
<line x1="685" y1="168" x2="870" y2="168" stroke="#adb5bd" stroke-dasharray="3 3"/>
<text x="690" y="205">pole sumy obu ramek</text>
<text x="470" y="306" font-weight="700" font-size="14">Dla przyk&#322;adu z lewej:</text>
<text x="470" y="330" font-size="14">szeroko&#347;&#263; cz&#281;&#347;ci wsp&#243;lnej = min(30, 40) &#8722; max(10, 20) = 10</text>
<text x="470" y="354" font-size="14">wysoko&#347;&#263; cz&#281;&#347;ci wsp&#243;lnej = min(30, 40) &#8722; max(10, 20) = 10</text>
<text x="470" y="378" font-size="14">cz&#281;&#347;&#263; wsp&#243;lna = 10 &#215; 10 = 100</text>
<text x="470" y="402" font-size="14">suma = 400 + 400 &#8722; 100 = 700</text>
<text x="470" y="426" font-weight="700" font-size="14">IoU = 100 / 700 &#8776; 0,14</text>
<text x="470" y="454" font-size="13" fill="#495057">Je&#347;li ramki si&#281; nie stykaj&#261;, szeroko&#347;&#263; lub wysoko&#347;&#263;</text>
<text x="470" y="472" font-size="13" fill="#495057">wychodzi ujemna: wtedy cz&#281;&#347;&#263; wsp&#243;lna = 0 i IoU = 0.</text>
<text x="20" y="495" font-weight="700" font-size="16">Kilka przypadk&#243;w</text>
<rect x="30" y="520" width="80" height="80" fill="#ffd8a8" opacity=".7"/>
<rect x="30" y="520" width="80" height="80" fill="#a5d8ff" opacity=".7"/>
