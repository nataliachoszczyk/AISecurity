<rect x="30" y="520" width="80" height="80" fill="none" stroke="#1c7ed6" stroke-width="2.5" stroke-dasharray="7 4"/>
<text x="30" y="662" font-size="13" fill="#495057">ta sama ramka</text>
<text x="30" y="682" font-weight="700" font-size="14">IoU = 1</text>
<rect x="212" y="520" width="80" height="80" fill="#ffd8a8" opacity=".7"/>
<rect x="252" y="520" width="80" height="80" fill="#a5d8ff" opacity=".7"/>
