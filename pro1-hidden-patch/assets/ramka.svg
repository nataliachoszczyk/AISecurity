<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#212529">
  <defs>
    <pattern id="noise" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#ffb38a"/>
      <rect x="0" y="0" width="6" height="6" fill="#f76707" opacity=".55"/>
      <rect x="12" y="0" width="6" height="6" fill="#f76707" opacity=".35"/>
      <rect x="6" y="6" width="6" height="6" fill="#f76707" opacity=".6"/>
      <rect x="0" y="12" width="6" height="6" fill="#f76707" opacity=".3"/>
      <rect x="12" y="12" width="6" height="6" fill="#f76707" opacity=".5"/>
    </pattern>
    <pattern id="decoy" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#dee2e6"/>
      <rect x="6" y="0" width="6" height="6" fill="#868e96" opacity=".5"/>
      <rect x="0" y="6" width="6" height="6" fill="#868e96" opacity=".35"/>
      <rect x="12" y="6" width="6" height="6" fill="#868e96" opacity=".55"/>
      <rect x="6" y="12" width="6" height="6" fill="#868e96" opacity=".3"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
  </defs>

  <rect width="940" height="560" fill="#ffffff"/>

  <!-- axis titles -->
  <line x1="70" y1="20" x2="200" y2="20" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="25">x = numer kolumny</text>
  <line x1="30" y1="60" x2="30" y2="190" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text transform="translate(25,200) rotate(90)">y = numer wiersza</text>

  <!-- the 64 x 64 image, 1 pixel = 6 units -->
  <rect x="70" y="60" width="384" height="384" fill="#f8f9fa" stroke="#212529" stroke-width="1.5"/>
  <g stroke="#e9ecef" stroke-width="1">
    <path d="M118 60V444M166 60V444M214 60V444M262 60V444M310 60V444M358 60V444M406 60V444"/>
    <path d="M70 108H454M70 156H454M70 204H454M70 252H454M70 300H454M70 348H454M70 396H454"/>
  </g>
  <g font-size="12" fill="#868e96" text-anchor="middle">
    <text x="70" y="54">0</text><text x="166" y="54">16</text><text x="262" y="54">32</text><text x="358" y="54">48</text><text x="454" y="54">64</text>
  </g>
  <g font-size="12" fill="#868e96" text-anchor="end">
    <text x="64" y="64">0</text><text x="64" y="160">16</text><text x="64" y="256">32</text><text x="64" y="352">48</text><text x="64" y="448">64</text>
  </g>

  <!-- decoy [40,5,58,22] -->
  <rect x="310" y="90" width="108" height="102" fill="url(#decoy)" stroke="#868e96" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="364" y="212" text-anchor="middle" font-size="13" fill="#495057">wabik: nie zaznaczamy</text>

  <!-- adversarial patch 12,40,33,58 -->
  <rect x="142" y="300" width="126" height="108" fill="url(#noise)" stroke="#d9480f" stroke-width="3"/>
  <text x="205" y="359" text-anchor="middle" font-weight="700" fill="#7f2704">&#322;atka</text>

  <!-- guides from the patch edges -->
  <g stroke="#d9480f" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="142" y1="408" x2="142" y2="470"/>
    <line x1="268" y1="408" x2="268" y2="470"/>
    <line x1="268" y1="300" x2="480" y2="300"/>
    <line x1="268" y1="408" x2="480" y2="408"/>
  </g>
  <g fill="#d9480f" font-weight="700">
    <text x="142" y="488" text-anchor="middle">x_min = 12</text>
    <text x="268" y="488" text-anchor="middle">x_max = 33</text>
    <text x="486" y="305">y_min = 40</text>
    <text x="486" y="413">y_max = 58</text>
  </g>

  <text x="70" y="528" font-size="16">Ten wiersz w pliku: <tspan font-family="Menlo, Consolas, monospace" font-weight="700">id,12,40,33,58</tspan></text>
  <text x="70" y="550" font-size="14" fill="#495057">szeroko&#347;&#263; = 33 &#8722; 12 = 21 pikseli, wysoko&#347;&#263; = 58 &#8722; 40 = 18 pikseli</text>

  <!-- zoom on the bottom-right corner: columns 30..34, rows 55..59, 1 pixel = 44 units -->
  <text x="640" y="40" font-weight="700">Zbli&#380;enie prawego dolnego rogu &#322;atki</text>
  <g>
    <rect x="640" y="90" width="132" height="132" fill="url(#noise)"/>
    <g fill="none" stroke="#adb5bd" stroke-width="1">
      <path d="M640 90H860M640 134H860M640 178H860M640 222H860M640 266H860M640 310H860"/>
      <path d="M640 90V310M684 90V310M728 90V310M772 90V310M816 90V310M860 90V310"/>
    </g>
    <path d="M772 90V222H640" fill="none" stroke="#d9480f" stroke-width="3"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#495057">
    <text x="662" y="80">30</text><text x="706" y="80">31</text><text x="750" y="80">32</text>
    <text x="794" y="80" fill="#d9480f" font-weight="700">33</text><text x="838" y="80">34</text>
  </g>
  <g font-size="13" text-anchor="end" fill="#495057">
    <text x="632" y="117">55</text><text x="632" y="161">56</text><text x="632" y="205">57</text>
    <text x="632" y="249" fill="#d9480f" font-weight="700">58</text><text x="632" y="293">59</text>
  </g>
  <text x="750" y="64" text-anchor="middle" font-size="12" fill="#868e96">kolumny</text>
  <text x="600" y="200" text-anchor="middle" font-size="12" fill="#868e96" transform="rotate(-90 600 200)">wiersze</text>

  <g font-size="14">
    <text x="640" y="345">Ostatnia kolumna &#322;atki to 32,</text>
    <text x="640" y="365">a <tspan fill="#d9480f" font-weight="700">x_max = 33</tspan> to pierwsza kolumna za ni&#261;.</text>
    <text x="640" y="395">Ostatni wiersz &#322;atki to 57,</text>
    <text x="640" y="415">a <tspan fill="#d9480f" font-weight="700">y_max = 58</tspan> to pierwszy wiersz pod ni&#261;.</text>
    <text x="640" y="445">Tak samo dzia&#322;a wycinek w Pythonie:</text>
    <text x="640" y="467" font-family="Menlo, Consolas, monospace" font-size="13">img[40:58, 12:33]</text>
  </g>
</svg>
